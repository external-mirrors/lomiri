---
clickable_minimum_required: 8.7.0
framework: ubuntu-touch-26.04-1.x
restrict_arch: amd64
is_app: false

templates:
  dep: &dep
    dependencies_host:
    - cmake
    - cmake-extras
    - dbus-test-runner
    - debhelper
    - dh-apparmor
    - doxyqml
    - g++
    - gdb
    - graphviz
    - pkgconf
    - python3-all
    - python3-setuptools:native
    - xvfb
    - xwayland

    dependencies_target:
    - fonts-ubuntu
    - libdeviceinfo-dev
    - libevdev-dev
    - libgeonames-dev
    - libgl-dev
    - libgl1-mesa-dri
    - libglib2.0-dev
    - libgnome-desktop-4-dev
    - libgsettings-qt-dev
    - libldm-common-dev
    - liblightdm-qt5-3-dev
    - liblomiri-api-dev
    - liblomiri-app-launch-dev
    - liblomiri-connectivity-qt1-dev
    - liblomiri-download-manager-common-dev
    - liblomiri-shell-notifications-dev
    - liblomirigestures-dev
    - liblomirigestures5-private-dev
    - liblomirisystemsettings-dev
    - libmiral-dev
    - libmiroil-dev
    - libpam0g-dev
    - libpulse-dev
    - libqmenumodel-dev
    - libqt5mir1server-dev
    - libqt5mir2server-dev
    - libqt5sql5-sqlite
    - libqt5svg5-dev
    - libqt5xmlpatterns5-dev
    - libqtdbusmock1-dev
    - libqtdbustest1-dev
    - libsystemd-dev
    - libudev-dev
    - libusermetricsoutput-dev
    - libx11-dev
    - libxcb1-dev
    - libxi-dev
    - lomiri-schemas
    - lomiri-wallpapers
    - qml-module-lomiri-components
    - qml-module-lomiri-components-extras
    - qml-module-lomiri-content
    - qml-module-lomiri-layouts
    - qml-module-lomiri-settings-components
    - qml-module-lomiri-settings-menus
    - qml-module-lomiri-test
    - qml-module-qt-labs-folderlistmodel
    - qml-module-qt-labs-settings
    - qml-module-qtmultimedia
    - qml-module-qtqml-statemachine
    - qml-module-qtquick-layouts
    - qml-module-qtquick-xmllistmodel
    - qml-module-qtquick2
    - qml-module-qttest
    - qtbase5-dev
    - qtbase5-dev-tools
    - qtbase5-private-dev
    - qtdbustest-runner
    - qtdeclarative5-dev
    - qtdeclarative5-dev-tools
    - qtdeclarative5-private-dev
    - systemd-dev

<<: *dep

libraries:
  lomiri:
    <<: *dep
    builder: cmake
    src_dir: ${ROOT}
    test: make xvfballtests -j${NUM_PROCS}
